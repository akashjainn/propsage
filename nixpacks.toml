[phases.setup]
nixPkgs = ['nodejs']

[phases.install]
cmd = 'npm install -g corepack@0.24.1 && corepack enable && pnpm install --frozen-lockfile'

[phases.build]
cmd = 'pnpm --filter @propsage/core build && pnpm --filter @propsage/api build'

[start]
cmd = 'cd apps/api && node dist/index.js'

[variables]
NODE_ENV = 'production'
